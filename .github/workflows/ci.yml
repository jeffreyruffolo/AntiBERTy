name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pre-commit
      - run: pre-commit run --all-files --show-diff-on-failure

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12"]
        transformers: ["transformers>=5"]
        include:
          # oldest and mid-range supported transformers releases
          - os: ubuntu-latest
            python-version: "3.10"
            transformers: "transformers==4.36.*"
          - os: ubuntu-latest
            python-version: "3.12"
            transformers: "transformers>=4.50,<5"
          - os: macos-latest
            python-version: "3.12"
            transformers: "transformers>=5"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e .[dev] "${{ matrix.transformers }}"
      - name: Cache Hugging Face Hub downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: hf-antiberty-${{ runner.os }}
      - name: Test
        env:
          ANTIBERTY_REQUIRE_WEIGHTS: "1"
        run: pytest -q
