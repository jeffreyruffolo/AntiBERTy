[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "antiberty"
version = "1.0.0"
description = "Antibody-specific transformer language model pre-trained on 558M natural antibody sequences"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE.MD"]
requires-python = ">=3.10"
authors = [{ name = "Jeffrey Ruffolo" }]
dependencies = [
  "huggingface_hub>=0.24",
  "torch>=2.0",
  "transformers>=4.36",
  "safetensors",
  "tqdm",
]

[project.scripts]
antiberty = "antiberty.cli:main"

[project.urls]
Homepage = "https://github.com/jeffreyruffolo/AntiBERTy"
Paper = "https://arxiv.org/abs/2112.07782"

[project.optional-dependencies]
dev = ["pytest", "pre-commit", "ruff"]

[tool.setuptools.packages.find]
include = ["antiberty*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501", "E741"]

[tool.ruff.lint.isort]
known-first-party = ["antiberty"]
